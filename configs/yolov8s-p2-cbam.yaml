# YOLOv8s with P2 Detection Layer and CBAM Attention
# Menambahkan fusi feature map stride 4 dan modul atensi CBAM pada level P2 & P3

nc: 10 # Default VisDrone 10 classes
scales:
  s: [0.33, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                        # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                        # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16 (P2 upsample)
  - [[-1, 2], 1, Concat, [1]]                  # 17 cat backbone P2
  - [-1, 3, C2f, [128]]                        # 18 (P2/4 - tiny objects)
  - [-1, 1, CBAM, [16, 7]]                     # 19 (CBAM pada representasi P2)

  - [-1, 1, Conv, [128, 3, 2]]                 # 20
  - [[-1, 15], 1, Concat, [1]]                 # 21 cat head P3
  - [-1, 3, C2f, [256]]                        # 22 (P3/8 - small objects)
  - [-1, 1, CBAM, [16, 7]]                     # 23 (CBAM pada representasi P3)

  - [-1, 1, Conv, [256, 3, 2]]                 # 24
  - [[-1, 12], 1, Concat, [1]]                 # 25 cat head P4
  - [-1, 3, C2f, [512]]                        # 26 (P4/16 - medium objects)

  - [-1, 1, Conv, [512, 3, 2]]                 # 27
  - [[-1, 9], 1, Concat, [1]]                  # 28 cat head P5
  - [-1, 3, C2f, [1024]]                       # 29 (P5/32 - large objects)

  - [[19, 23, 26, 29], 1, Detect, [nc]]        # 30 Detect(P2_CBAM, P3_CBAM, P4, P5)
